<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simples Oculto — Painel Administrativo</title>
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #09090b; }
      .admin-shell { min-height: 100vh; color: #f4f4f5; background: radial-gradient(circle at top right, rgba(109,40,217,.16), transparent 34rem), #09090b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .admin-wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      .admin-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 2rem; }
      .admin-eyebrow { color: #a78bfa; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 700; }
      .admin-title { margin: .35rem 0 0; font-family: Georgia, serif; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.03em; }
      .admin-subtitle { color: #a1a1aa; font-size: .88rem; margin: .45rem 0 0; }
      .admin-badge { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid rgba(167,139,250,.35); background: rgba(124,58,237,.14); border-radius: 999px; padding: .5rem .75rem; color: #ddd6fe; font-size: .75rem; font-weight: 600; white-space: nowrap; }
      .admin-dot { width: .42rem; height: .42rem; border-radius: 999px; background: #a78bfa; box-shadow: 0 0 12px #a78bfa; }
      .admin-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 1.25rem; align-items: start; }
      .admin-card { border: 1px solid #27272a; background: rgba(24,24,27,.82); border-radius: 1rem; padding: 1.25rem; box-shadow: 0 18px 50px rgba(0,0,0,.16); }
      .admin-card h2 { margin: 0; font-size: 1rem; }
      .admin-card-head { display: flex; justify-content: space-between; gap: 1rem; align-items: center; margin-bottom: 1.1rem; }
      .admin-label { display: block; color: #d4d4d8; font-size: .78rem; font-weight: 600; margin-bottom: .42rem; }
      .admin-field { margin-bottom: 1rem; }
      .admin-input, .admin-textarea, .admin-select { width: 100%; box-sizing: border-box; border: 1px solid #3f3f46; background: #18181b; border-radius: .65rem; color: #f4f4f5; padding: .72rem .8rem; font: inherit; font-size: .86rem; outline: none; transition: .2s; }
      .admin-input:focus, .admin-textarea:focus, .admin-select:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.14); }
      .admin-textarea { min-height: 126px; resize: vertical; }
      .admin-secret { position: relative; }
      .admin-secret .admin-input { padding-right: 2.9rem; }
      .admin-eye { position: absolute; right: .65rem; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #a1a1aa; cursor: pointer; font-size: 1rem; }
      .admin-two { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .admin-hint { color: #71717a; font-size: .72rem; margin-top: .4rem; }
      .admin-button { width: 100%; border: 0; border-radius: .65rem; padding: .8rem 1rem; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(124,58,237,.2); transition: .2s; }
      .admin-button:hover { filter: brightness(1.12); transform: translateY(-1px); }
      .admin-button:disabled { opacity: .65; cursor: wait; transform: none; }
      .admin-copy { border: 1px solid #3f3f46; background: #18181b; color: #d4d4d8; border-radius: .55rem; padding: .5rem .7rem; font-size: .73rem; cursor: pointer; }
      .admin-copy:hover { border-color: #8b5cf6; color: white; }
      .admin-logout { border: 1px solid #3f3f46; background: rgba(24,24,27,.8); color: #a1a1aa; border-radius: .55rem; padding: .55rem .75rem; font-size: .73rem; cursor: pointer; }
      .admin-logout:hover { border-color: #a78bfa; color: #fff; }
      .admin-login-shell { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(circle at top right, rgba(109,40,217,.2), transparent 32rem), #09090b; color: #f4f4f5; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .admin-login { width: min(100%, 390px); border: 1px solid #27272a; background: rgba(24,24,27,.9); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
      .admin-login h1 { margin: .4rem 0 .5rem; font-family: Georgia, serif; font-size: 1.7rem; }
      .admin-login p { color: #a1a1aa; font-size: .85rem; line-height: 1.5; margin: 0 0 1.35rem; }
      .admin-error { color: #fda4af; font-size: .78rem; margin: .7rem 0 0; }
      .admin-status { display: none; margin-top: 1rem; padding: .75rem; border-radius: .6rem; border: 1px solid rgba(167,139,250,.25); color: #c4b5fd; background: rgba(124,58,237,.1); font-size: .78rem; line-height: 1.45; }
      .admin-status.show { display: block; }
      .admin-posts { display: flex; flex-direction: column; gap: .8rem; }
      .admin-empty { color: #71717a; font-size: .85rem; line-height: 1.5; padding: 1rem 0; }
      .admin-post { border: 1px solid #27272a; border-radius: .75rem; padding: 1rem; background: #111113; }
      .admin-post-title { margin: 0 0 .55rem; font-family: Georgia, serif; font-size: 1.05rem; }
      .admin-meta { display: flex; flex-wrap: wrap; gap: .4rem; color: #a1a1aa; font-size: .7rem; margin-bottom: .7rem; }
      .admin-chip { border: 1px solid #3f3f46; border-radius: 999px; padding: .25rem .5rem; }
      .admin-detail { color: #a1a1aa; font-size: .74rem; line-height: 1.45; margin: .35rem 0; }
      .admin-detail strong { color: #d4d4d8; }
      .admin-html { border-left: 2px solid #7c3aed; padding: .45rem .7rem; margin-top: .7rem; max-height: 112px; overflow: auto; color: #a1a1aa; font-size: .75rem; background: #18181b; border-radius: 0 .4rem .4rem 0; }
      .admin-divider { border-top: 1px solid #27272a; margin: 1.25rem 0; }
      @media (max-width: 820px) { .admin-grid { grid-template-columns: 1fr; } .admin-top { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div id="admin-root"></div>

    <script>
      (function () {
        const root = document.getElementById('admin-root');
        const esc = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));

        if (sessionStorage.getItem('simples-oculto-admin-auth') !== 'true') {
          root.innerHTML = `
            <main class="admin-login-shell">
              <section class="admin-login" aria-labelledby="admin-login-title">
                <div class="admin-eyebrow">Simples Oculto</div>
                <h1 id="admin-login-title">Acesso administrativo</h1>
                <p>Entre com suas credenciais para acessar o gerador de artigos com IA.</p>
                <form id="admin-login-form">
                  <div class="admin-field">
                    <label class="admin-label" for="admin-user">Usuário</label>
                    <input id="admin-user" class="admin-input" autocomplete="username" required>
                  </div>
                  <div class="admin-field">
                    <label class="admin-label" for="admin-password">Senha</label>
                    <input id="admin-password" class="admin-input" type="password" autocomplete="current-password" required>
                  </div>
                  <button class="admin-button" type="submit">Entrar no painel</button>
                  <p id="admin-login-error" class="admin-error" role="alert" hidden>Usuário ou senha inválidos.</p>
                </form>
              </section>
            </main>`;
          
          document.getElementById('admin-login-form').onsubmit = function (event) {
            event.preventDefault();
            const user = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-password').value;
            const error = document.getElementById('admin-login-error');
            if (user === 'Admin' && password === 'Admin577') {
              sessionStorage.setItem('simples-oculto-admin-auth', 'true');
              window.location.reload();
            } else {
              error.hidden = false;
            }
          };
          return;
        }

        let posts = [];

        root.innerHTML = `
          <main class="admin-shell">
            <div class="admin-wrap">
              <header class="admin-top">
                <div>
                  <div class="admin-eyebrow">Simples Oculto</div>
                  <h1 class="admin-title">Painel Administrativo</h1>
                  <p class="admin-subtitle">Crie, otimize e publique artigos com assistência de IA.</p>
                </div>
                <div style="display:flex;align-items:center;gap:.6rem">
                  <div class="admin-badge"><span class="admin-dot"></span>IA Conectada</div>
                  <button class="admin-logout" id="admin-logout" type="button">Sair / Logout</button>
                </div>
              </header>
              <div class="admin-grid">
                <section class="admin-card">
                  <div class="admin-card-head">
                    <h2>Novo artigo com IA</h2>
                    <span class="admin-eyebrow">Gemini & GitHub</span>
                  </div>
                  <form id="admin-form">
                    <div class="admin-field">
                      <label class="admin-label" for="api-key">Gemini API Key</label>
                      <div class="admin-secret">
                        <input id="api-key" class="admin-input" type="password" placeholder="Cole sua chave do Google AI Studio" autocomplete="off" required>
                        <button class="admin-eye" type="button" id="toggle-key" aria-label="Mostrar chave">◉</button>
                      </div>
                      <div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.5rem">
                        <div class="admin-hint" style="margin-top:0">Salva apenas neste navegador.</div>
                        <button class="admin-copy" type="button" id="save-key">Salvar chave</button>
                      </div>
                    </div>

                    <div class="admin-divider"></div>

                    <div class="admin-field">
                      <label class="admin-label" for="gh-token">GitHub Personal Access Token</label>
                      <input id="gh-token" class="admin-input" type="password" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
                    </div>
                    <div class="admin-two">
                      <div class="admin-field">
                        <label class="admin-label" for="gh-owner">Usuário / Organização</label>
                        <input id="gh-owner" class="admin-input" placeholder="Ex: seu-usuario">
                      </div>
                      <div class="admin-field">
                        <label class="admin-label" for="gh-repo">Nome do Repositório</label>
                        <input id="gh-repo" class="admin-input" placeholder="Ex: simples-oculto">
                      </div>
                    </div>
                    <div class="admin-field">
                      <label class="admin-label" for="gh-path">Caminho do Arquivo JSON no Repo</label>
                      <input id="gh-path" class="admin-input" placeholder="Ex: src/data/posts.json ou public/posts.json" value="src/data/posts.json">
                      <div style="display:flex;justify-content:flex-end;margin-top:.5rem">
                        <button class="admin-copy" type="button" id="save-gh">Salvar Configs GitHub</button>
                      </div>
                    </div>

                    <div class="admin-divider"></div>

                    <div class="admin-field">
                      <label class="admin-label" for="raw-title">Título Bruto / Ideia Principal</label>
                      <input id="raw-title" class="admin-input" placeholder="Ex.: Como interpretar sonhos recorrentes" required>
                    </div>
                    <div class="admin-field">
                      <label class="admin-label" for="base-content">Conteúdo Base, Rascunho ou Tópicos</label>
                      <textarea id="base-content" class="admin-textarea" placeholder="Inclua fatos, tópicos, referências ou o rascunho inicial..."></textarea>
                    </div>
                    <div class="admin-field">
                      <label class="admin-label" for="cover-url">URL da Imagem de Capa</label>
                      <input id="cover-url" class="admin-input" type="url" placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <div class="admin-two">
                      <div class="admin-field">
                        <label class="admin-label" for="category">Categoria</label>
                        <select id="category" class="admin-select">
                          <option>Ocultismo</option>
                          <option>Mistérios</option>
                          <option>Tecnologia</option>
                          <option>Negócios</option>
                          <option>SEO</option>
                        </select>
                      </div>
                      <div class="admin-field">
                        <label class="admin-label" for="keyword">Palavra-chave Foco (SEO)</label>
                        <input id="keyword" class="admin-input" placeholder="Ex.: significado dos sonhos">
                      </div>
                    </div>
                    <button class="admin-button" type="submit" id="generate"><span>✦</span> Gerar e Publicar Artigo Online</button>
                    <div class="admin-status" id="status" role="status" aria-live="polite"></div>
                  </form>
                </section>
                <section class="admin-card">
                  <div class="admin-card-head">
                    <div>
                      <h2>Artigos publicados</h2>
                      <p class="admin-subtitle" id="post-count">Carregando...</p>
                    </div>
                    <button class="admin-copy" id="copy-json" type="button">Copiar JSON</button>
                  </div>
                  <div class="admin-posts" id="posts">
                    <p class="admin-empty">Os artigos gerados aparecerão aqui.</p>
                  </div>
                </section>
              </div>
            </div>
          </main>`;

        // Recuperar chaves salvas
        const savedApiKey = localStorage.getItem('simples-oculto-gemini-api-key');
        if (savedApiKey) document.getElementById('api-key').value = savedApiKey;

        const savedGhToken = localStorage.getItem('simples-oculto-gh-token');
        if (savedGhToken) document.getElementById('gh-token').value = savedGhToken;
        const savedGhOwner = localStorage.getItem('simples-oculto-gh-owner');
        if (savedGhOwner) document.getElementById('gh-owner').value = savedGhOwner;
        const savedGhRepo = localStorage.getItem('simples-oculto-gh-repo');
        if (savedGhRepo) document.getElementById('gh-repo').value = savedGhRepo;
        const savedGhPath = localStorage.getItem('simples-oculto-gh-path');
        if (savedGhPath) document.getElementById('gh-path').value = savedGhPath;

        document.getElementById('save-key').onclick = function () {
          const apiKey = document.getElementById('api-key').value.trim();
          if (!apiKey) return;
          localStorage.setItem('simples-oculto-gemini-api-key', apiKey);
          status.className = 'admin-status show';
          status.textContent = 'Chave da Gemini salva!';
        };

        document.getElementById('save-gh').onclick = function () {
          const token = document.getElementById('gh-token').value.trim();
          const owner = document.getElementById('gh-owner').value.trim();
          const repo = document.getElementById('gh-repo').value.trim();
          const path = document.getElementById('gh-path').value.trim();

          localStorage.setItem('simples-oculto-gh-token', token);
          localStorage.setItem('simples-oculto-gh-owner', owner);
          localStorage.setItem('simples-oculto-gh-repo', repo);
          localStorage.setItem('simples-oculto-gh-path', path);

          status.className = 'admin-status show';
          status.textContent = 'Configurações do GitHub salvas com sucesso!';
        };

        document.getElementById('admin-logout').onclick = function () {
          sessionStorage.removeItem('simples-oculto-admin-auth');
          window.location.reload();
        };

        document.getElementById('toggle-key').onclick = function () {
          const input = document.getElementById('api-key');
          input.type = input.type === 'password' ? 'text' : 'password';
        };

        function renderPostsList() {
          document.getElementById('post-count').textContent = posts.length ? `${posts.length} artigo(s) no repositório` : 'Nenhum artigo encontrado';
          document.getElementById('posts').innerHTML = posts.length ? posts.map((post) => `
            <article class="admin-post">
              <h3 class="admin-post-title">${esc(post.title)}</h3>
              <div class="admin-meta">
                <span class="admin-chip">${esc(post.category)}</span>
                <span class="admin-chip">/${esc(post.slug)}</span>
              </div>
              <p class="admin-detail"><strong>Meta Title:</strong> ${esc(post.metaTitle)}</p>
              <p class="admin-detail"><strong>Meta Description:</strong> ${esc(post.metaDescription)}</p>
              <div class="admin-html">${esc(post.content)}</div>
            </article>`).join('') : '<p class="admin-empty">Nenhum artigo publicado ainda.</p>';
        }

        // Tentar carregar os posts atuais direto do GitHub ao abrir o painel
        async function fetchExistingPosts() {
          const token = localStorage.getItem('simples-oculto-gh-token');
          const owner = localStorage.getItem('simples-oculto-gh-owner');
          const repo = localStorage.getItem('simples-oculto-gh-repo');
          const path = localStorage.getItem('simples-oculto-gh-path') || 'src/data/posts.json';

          if (!token || !owner || !repo) {
            document.getElementById('post-count').textContent = 'Configure o GitHub para sincronizar';
            return;
          }

          try {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const res = await fetch(url, {
              headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
            });
            if (res.ok) {
              const fileData = await res.json();
              const decoded = decodeURIComponent(escape(atob(fileData.content)));
              posts = JSON.parse(decoded);
              renderPostsList();
            }
          } catch (e) {
            console.error('Erro ao buscar posts do GitHub:', e);
          }
        }

        fetchExistingPosts();

        const form = document.getElementById('admin-form');
        const status = document.getElementById('status');
        const button = document.getElementById('generate');

        form.onsubmit = async function (event) {
          event.preventDefault();
          const apiKey = document.getElementById('api-key').value.trim();
          const title = document.getElementById('raw-title').value.trim();
          const base = document.getElementById('base-content').value.trim();
          const coverImage = document.getElementById('cover-url').value.trim();
          const category = document.getElementById('category').value;
          const keyword = document.getElementById('keyword').value.trim();

          const token = document.getElementById('gh-token').value.trim();
          const owner = document.getElementById('gh-owner').value.trim();
          const repo = document.getElementById('gh-repo').value.trim();
          const path = document.getElementById('gh-path').value.trim() || 'src/data/posts.json';

          if (!apiKey) {
            status.className = 'admin-status show';
            status.textContent = 'Por favor, insira a Gemini API Key.';
            return;
          }
          if (!token || !owner || !repo) {
            status.className = 'admin-status show';
            status.textContent = 'Preencha as credenciais do GitHub para publicar online.';
            return;
          }

          button.disabled = true;
          status.className = 'admin-status show';
          status.textContent = 'Gerando artigo com o Gemini...';

          const promptText = `Você é um Senior Copywriter e SEO Specialist. Crie um artigo em português do Brasil sobre: ${title}. Palavra-chave foco: ${keyword || 'defina uma palavra-chave relevante'}. Categoria: ${category}. Conteúdo base: ${base || 'desenvolva a pauta com pesquisa e contexto editorial'}. Retorne estritamente no formato JSON puro, sem blocos de código markdown ou crases, contendo exatamente estas chaves: title (título envolvente e de alta conversão), slug (slug SEO amigável), metaTitle (máximo 60 caracteres), metaDescription (máximo 160 caracteres), content (artigo 100% original e expandido em HTML limpo usando apenas h2, h3, p, ul, li e strong), altText (ALT otimizado baseado na palavra-chave e no título).`;

          const endpoints = [
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
            `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`
          ];

          let responseData = null;
          let lastErrorMsg = '';

          for (let i = 0; i < endpoints.length; i++) {
            try {
              status.textContent = `Tentando conexão com Gemini (tentativa ${i + 1})...`;
              const res = await fetch(endpoints[i], {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
              });
              const json = await res.json();
              if (res.ok && json.candidates && json.candidates[0]?.content?.parts?.[0]?.text) {
                responseData = json.candidates[0].content.parts[0].text;
                break;
              } else {
                lastErrorMsg = json.error?.message || `Erro HTTP ${res.status}`;
              }
            } catch (err) {
              lastErrorMsg = err.message;
            }
          }

          try {
            if (!responseData) throw new Error(`Falha na API do Gemini: ${lastErrorMsg}`);

            status.textContent = 'Processando estrutura JSON...';
            let cleanJson = responseData.trim();
            const jsonMatch = cleanJson.match(/\{[\s\S]*\}/);
            if (jsonMatch) cleanJson = jsonMatch[0];
            else cleanJson = cleanJson.replace(/^```(json)?/i, '').replace(/```$/, '').trim();

            const newPost = { ...JSON.parse(cleanJson), coverImage, category, date: new Date().toLocaleDateString('pt-BR') };

            status.textContent = 'Enviando commit automático para o GitHub...';

            // 1. Obter arquivo atual do repositório para capturar o SHA
            const fileUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const fileRes = await fetch(fileUrl, {
              headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
            });

            let fileSha = null;
            let existingPosts = [];
            if (fileRes.ok) {
              const fileData = await fileRes.json();
              fileSha = fileData.sha;
              try {
                existingPosts = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
              } catch (e) { existingPosts = []; }
            }

            existingPosts.unshift(newPost);
            posts = existingPosts;

            // 2. Fazer o PUT com o commit atualizado
            const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
            const commitRes = await fetch(fileUrl, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: `CMS: Publicar post "${newPost.title}"`,
                content: contentBase64,
                sha: fileSha
              })
            });

            if (!commitRes.ok) {
              const errData = await commitRes.json();
              throw new Error(`Erro no GitHub: ${errData.message || commitRes.statusText}`);
            }

            renderPostsList();
            status.textContent = 'Artigo publicado online com sucesso! A Vercel atualizará o site em instantes.';
            form.reset();
          } catch (error) {
            status.textContent = error instanceof SyntaxError ? 'Erro: A IA retornou um JSON corrompido. Tente novamente.' : error.message;
          } finally {
            button.disabled = false;
          }
        };

        document.getElementById('copy-json').onclick = async function () {
          if (!posts.length) return;
          await navigator.clipboard.writeText(JSON.stringify(posts, null, 2));
          status.className = 'admin-status show';
          status.textContent = 'JSON copiado para a área de transferência.';
        };
      })();
    </script>
  </body>
</html>
