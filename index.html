    <script>
      (function () {
        if (window.location.pathname !== '/admin' && window.location.pathname !== '/admin/') return;
        document.body.classList.add('admin-mode');
        document.title = 'Simples Oculto — Painel Admin';
        const root = document.getElementById('admin-root');
        const esc = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
        if (sessionStorage.getItem('simples-oculto-admin-auth') !== 'true') {
          root.innerHTML = `<main class="admin-login-shell"><section class="admin-login" aria-labelledby="admin-login-title"><div class="admin-eyebrow">Simples Oculto</div><h1 id="admin-login-title">Acesso administrativo</h1><p>Entre com suas credenciais para acessar o gerador de artigos com IA.</p><form id="admin-login-form"><div class="admin-field"><label class="admin-label" for="admin-user">Usuário</label><input id="admin-user" class="admin-input touch-manipulation focus:outline-none focus:ring-2" autocomplete="username" required></div><div class="admin-field"><label class="admin-label" for="admin-password">Senha</label><input id="admin-password" class="admin-input touch-manipulation focus:outline-none focus:ring-2" type="password" autocomplete="current-password" required></div><button class="admin-button" type="submit">Entrar no painel</button><p id="admin-login-error" class="admin-error" role="alert" hidden>Usuário ou senha inválidos.</p></form></section></main>`;
          document.getElementById('admin-login-form').onsubmit = function (event) { event.preventDefault(); const user = document.getElementById('admin-user').value; const password = document.getElementById('admin-password').value; const error = document.getElementById('admin-login-error'); if (user === 'Admin' && password === 'Admin577') { sessionStorage.setItem('simples-oculto-admin-auth', 'true'); window.location.reload(); } else { error.hidden = false; } };
          return;
        }
        let posts = [];
        root.innerHTML = `<main class="admin-shell"><div class="admin-wrap"><header class="admin-top"><div><div class="admin-eyebrow">Simples Oculto</div><h1 class="admin-title">Painel Administrativo</h1><p class="admin-subtitle">Crie, otimize e publique artigos com assistência de IA.</p></div><div style="display:flex;align-items:center;gap:.6rem"><div class="admin-badge"><span class="admin-dot"></span>IA Conectada</div><button class="admin-logout" id="admin-logout" type="button">Sair / Logout</button></div></header><div class="admin-grid"><section class="admin-card"><div class="admin-card-head"><h2>Novo artigo com IA</h2><span class="admin-eyebrow">Gemini</span></div><form id="admin-form"><div class="admin-field"><label class="admin-label" for="api-key">Gemini API Key</label><div class="admin-secret"><input id="api-key" class="admin-input touch-manipulation focus:outline-none focus:ring-2" type="password" placeholder="Cole sua chave do Google AI Studio" autocomplete="off" required><button class="admin-eye" type="button" id="toggle-key" aria-label="Mostrar chave">◉</button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.5rem"><div class="admin-hint" style="margin-top:0">A chave fica salva apenas neste navegador.</div><button class="admin-copy" type="button" id="save-key">Salvar chave</button></div></div><div class="admin-field"><label class="admin-label" for="raw-title">Título Bruto / Ideia Principal</label><input id="raw-title" class="admin-input touch-manipulation focus:outline-none focus:ring-2" placeholder="Ex.: Como interpretar sonhos recorrentes" required></div><div class="admin-field"><label class="admin-label" for="base-content">Conteúdo Base, Rascunho ou Tópicos</label><textarea id="base-content" class="admin-textarea touch-manipulation focus:outline-none focus:ring-2" placeholder="Inclua fatos, tópicos, referências ou o rascunho inicial..."></textarea></div><div class="admin-field"><label class="admin-label" for="cover-url">URL da Imagem de Capa</label><input id="cover-url" class="admin-input touch-manipulation focus:outline-none focus:ring-2" type="url" placeholder="https://exemplo.com/imagem.jpg"></div><div class="admin-two"><div class="admin-field"><label class="admin-label" for="category">Categoria</label><select id="category" class="admin-select"><option>Ocultismo</option><option>Mistérios</option><option>Tecnologia</option><option>Negócios</option><option>SEO</option></select></div><div class="admin-field"><label class="admin-label" for="keyword">Palavra-chave Foco (SEO)</label><input id="keyword" class="admin-input touch-manipulation focus:outline-none focus:ring-2" placeholder="Ex.: significado dos sonhos"></div></div><button class="admin-button" type="submit" id="generate"><span>✦</span> Gerar e Publicar Artigo com IA</button><div class="admin-status" id="status" role="status" aria-live="polite"></div></form></section><section class="admin-card"><div class="admin-card-head"><div><h2>Artigos gerados</h2><p class="admin-subtitle" id="post-count">Nenhum artigo nesta sessão</p></div><button class="admin-copy" id="copy-json" type="button">Copiar JSON dos Artigos</button></div><div class="admin-posts" id="posts"><p class="admin-empty">Os artigos gerados aparecerão aqui com seus dados de SEO e uma prévia do HTML.</p></div></section></div></div></main>`;
        const form = document.getElementById('admin-form'), status = document.getElementById('status'), button = document.getElementById('generate');
        const savedApiKey = localStorage.getItem('simples-oculto-gemini-api-key');
        if (savedApiKey) document.getElementById('api-key').value = savedApiKey;
        document.getElementById('save-key').onclick = function () { const apiKey = document.getElementById('api-key').value.trim(); if (!apiKey) { status.className = 'admin-status show'; status.textContent = 'Cole uma chave da Gemini antes de salvar.'; return; } localStorage.setItem('simples-oculto-gemini-api-key', apiKey); status.className = 'admin-status show'; status.textContent = 'Chave da Gemini salva neste navegador.'; };
        document.getElementById('admin-logout').onclick = function () { sessionStorage.removeItem('simples-oculto-admin-auth'); window.location.reload(); };
        document.getElementById('toggle-key').onclick = function () { const input = document.getElementById('api-key'); input.type = input.type === 'password' ? 'text' : 'password'; this.setAttribute('aria-label', input.type === 'password' ? 'Mostrar chave' : 'Ocultar chave'); };
        function renderPosts() { document.getElementById('post-count').textContent = posts.length ? posts.length + (posts.length === 1 ? ' artigo publicado nesta sessão' : ' artigos publicados nesta sessão') : 'Nenhum artigo nesta sessão'; document.getElementById('posts').innerHTML = posts.length ? posts.map((post) => `<article class="admin-post"><h3 class="admin-post-title">${esc(post.title)}</h3><div class="admin-meta"><span class="admin-chip">${esc(post.category)}</span><span class="admin-chip">/${esc(post.slug)}</span></div><p class="admin-detail"><strong>Meta Title:</strong> ${esc(post.metaTitle)}</p><p class="admin-detail"><strong>Meta Description:</strong> ${esc(post.metaDescription)}</p><p class="admin-detail"><strong>ALT:</strong> ${esc(post.altText)}</p><div class="admin-html">${esc(post.content)}</div></article>`).join('') : '<p class="admin-empty">Os artigos gerados aparecerão aqui com seus dados de SEO e uma prévia do HTML.</p>'; }
        form.onsubmit = async function (event) { event.preventDefault(); const apiKey = document.getElementById('api-key').value.trim(); const title = document.getElementById('raw-title').value.trim(); const base = document.getElementById('base-content').value.trim(); const coverImage = document.getElementById('cover-url').value.trim(); const category = document.getElementById('category').value; const keyword = document.getElementById('keyword').value.trim(); button.disabled = true; status.className = 'admin-status show'; status.textContent = 'A IA está redigindo o texto original, formatando HTML e otimizando o SEO...'; try { const prompt = `Você é um Senior Copywriter e SEO Specialist. Crie um artigo em português do Brasil sobre: ${title}. Palavra-chave foco: ${keyword || 'defina uma palavra-chave relevante'}. Categoria: ${category}. Conteúdo base: ${base || 'desenvolva a pauta com pesquisa e contexto editorial'}. Retorne SOMENTE uma string JSON crua, sem markdown ou crases, com exatamente estas chaves: title (título envolvente e de alta conversão), slug (slug SEO amigável), metaTitle (máximo 60 caracteres), metaDescription (máximo 160 caracteres), content (artigo 100% original e expandido em HTML limpo usando apenas h2, h3, p, ul, li e strong), altText (ALT otimizado baseado na palavra-chave e no título).`; const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + encodeURIComponent(apiKey), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }] }) }); if (!response.ok) throw new Error('Não foi possível conectar ao Gemini. Verifique a chave e tente novamente.'); const data = await response.json(); const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || ''; const clean = raw.replace(/^```json\\s*|\\s*```$/g, '').trim(); const post = JSON.parse(clean); posts.unshift({...post, coverImage, category}); renderPosts(); status.textContent = 'Artigo gerado e adicionado ao feed com sucesso.'; form.reset(); } catch (error) { status.textContent = error instanceof SyntaxError ? 'A resposta da IA não veio em JSON válido. Tente novamente.' : error.message; } finally { button.disabled = false; } };
        document.getElementById('copy-json').onclick = async function () { if (!posts.length) { status.className = 'admin-status show'; status.textContent = 'Gere pelo menos um artigo antes de copiar o JSON.'; return; } await navigator.clipboard.writeText(JSON.stringify(posts, null, 2)); status.className = 'admin-status show'; status.textContent = 'JSON dos artigos copiado para a área de transferência.'; };
      })();
    </script>
